name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e '.[dev,markdown]'
      - name: Tests
        run: pytest
      # CLI regression (Phase 5 P5-7): same entrypoints as local `openayane-rde` after editable install.
      - name: CLI schema validate
        run: openayane-rde schema validate --repo-root .
      - name: CLI golden run
        run: openayane-rde golden run --repo-root .
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
