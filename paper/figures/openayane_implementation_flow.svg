<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">OpenAyane implementation flow</title>
  <desc id="desc">OpenAyane is a mechanism integrating the RDE evaluator, policy bridge, audit log, relation store, and historical feedback loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#263238"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#1565C0"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#AD1457"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/></filter>
    <style>
      .bg{fill:#FAFAF7}.title{font-family:'Noto Sans CJK JP','Hiragino Sans',sans-serif;font-size:34px;font-weight:700;fill:#263238}.subtitle{font-family:'Noto Sans CJK JP','Hiragino Sans',sans-serif;font-size:18px;fill:#455A64}.label{font-family:'Noto Sans CJK JP','Hiragino Sans',sans-serif;font-size:21px;font-weight:700;fill:#263238}.small{font-family:'Noto Sans CJK JP','Hiragino Sans',sans-serif;font-size:15px;fill:#455A64}.box{fill:#fff;stroke:#546E7A;stroke-width:2;rx:18;filter:url(#shadow)}.input{fill:#E3F2FD;stroke:#1565C0}.contract{fill:#E8F5E9;stroke:#2E7D32}.generator{fill:#FFF8E1;stroke:#F9A825}.diff{fill:#F3E5F5;stroke:#6A1B9A}.rde{fill:#FCE4EC;stroke:#AD1457;stroke-width:3}.policy{fill:#E0F2F1;stroke:#00695C}.runtime{fill:#ECEFF1;stroke:#37474F}.history{fill:#FFF3E0;stroke:#EF6C00}.relation{fill:#EDE7F6;stroke:#4527A0}.outer{fill:none;stroke:#90A4AE;stroke-width:3;stroke-dasharray:10 7;rx:28}.rdeFrame{fill:none;stroke:#AD1457;stroke-width:3;stroke-dasharray:8 6;rx:24}.arrow{fill:none;stroke:#263238;stroke-width:3;marker-end:url(#arrow)}.arrowBlue{fill:none;stroke:#1565C0;stroke-width:4;marker-end:url(#arrowBlue)}.arrowRed{fill:none;stroke:#AD1457;stroke-width:4;marker-end:url(#arrowRed)}.dash{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="1200"/>
  <text class="title" x="80" y="62">OpenAyane の実装フロー</text>
  <text class="subtitle" x="80" y="95">RDE は評価器、OpenAyane は AuditLog と RelationStore を含む履歴参照ループ機構</text>
  <rect class="outer" x="55" y="125" width="1490" height="1015" rx="30"/>
  <text class="small" x="75" y="155">OpenAyane mechanism</text>

  <g id="forward">
    <rect class="box input" x="110" y="190" width="300" height="78" rx="18"/><text class="label" x="145" y="224">User / External Trigger</text><text class="small" x="145" y="248">要求・イベント・Agent計画</text>
    <rect class="box input" x="110" y="305" width="300" height="78" rx="18"/><text class="label" x="145" y="339">Intent Parser</text><text class="small" x="145" y="363">操作意図と対象を抽出</text>
    <rect class="box relation" x="110" y="420" width="300" height="78" rx="18"/><text class="label" x="145" y="454">RelationContext Loader</text><text class="small" x="145" y="478">履歴状態を読み込む</text>
    <rect class="box contract" x="110" y="535" width="300" height="78" rx="18"/><text class="label" x="145" y="569">Task Contract Builder</text><text class="small" x="145" y="593">許可ΔM・保護対象を契約化</text>
    <rect class="box generator" x="110" y="650" width="300" height="78" rx="18"/><text class="label" x="145" y="684">Generator Adapter</text><text class="small" x="145" y="708">LLM / Tool / Local model</text>
    <rect class="box generator" x="110" y="765" width="300" height="78" rx="18"/><text class="label" x="145" y="799">Output / Patch / Plan</text><text class="small" x="145" y="823">生成結果と self-report</text>
    <line class="arrow" x1="260" y1="268" x2="260" y2="305"/><line class="arrow" x1="260" y1="383" x2="260" y2="420"/><line class="arrow" x1="260" y1="498" x2="260" y2="535"/><line class="arrow" x1="260" y1="613" x2="260" y2="650"/><line class="arrow" x1="260" y1="728" x2="260" y2="765"/>
  </g>

  <g id="rde-area">
    <rect class="rdeFrame" x="510" y="245" width="430" height="598" rx="24"/>
    <text class="small" x="535" y="274">RDE evaluation pipeline</text>
    <rect class="box diff" x="565" y="305" width="320" height="78" rx="18"/><text class="label" x="604" y="339">Structural Diff</text><text class="small" x="604" y="363">Markdown / JSON / AST</text>
    <rect class="box diff" x="565" y="420" width="320" height="78" rx="18"/><text class="label" x="604" y="454">Semantic Delta</text><text class="small" x="604" y="478">主張・定義・制約の変化</text>
    <rect class="box rde" x="565" y="535" width="320" height="108" rx="18"/><text class="label" x="620" y="575">RDE Core</text><text class="small" x="604" y="600">意味変化 ΔM を分類する評価器</text><text class="small" x="604" y="623">preserved / drift / corruption</text>
    <rect class="box policy" x="565" y="690" width="320" height="78" rx="18"/><text class="label" x="620" y="724">Policy Bridge</text><text class="small" x="604" y="748">評価結果を実行判断へ変換</text>
    <line class="arrow" x1="725" y1="383" x2="725" y2="420"/><line class="arrow" x1="725" y1="498" x2="725" y2="535"/><line class="arrow" x1="725" y1="643" x2="725" y2="690"/>
    <path class="arrow" d="M410 804 C470 804 500 344 565 344"/>
  </g>

  <g id="runtime-history">
    <rect class="box runtime" x="1030" y="305" width="350" height="88" rx="18"/><text class="label" x="1080" y="342">Modification Control</text><text class="small" x="1080" y="366">apply / reject / rollback</text>
    <rect class="box runtime" x="1030" y="440" width="350" height="88" rx="18"/><text class="label" x="1078" y="477">Safe Execution Runtime</text><text class="small" x="1078" y="501">File Patch / Tool Call / Sandbox</text>
    <rect class="box history" x="1030" y="585" width="350" height="88" rx="18"/><text class="label" x="1116" y="622">AuditLog</text><text class="small" x="1070" y="646">差分・分類・判断・レビューを記録</text>
    <rect class="box relation" x="1030" y="730" width="350" height="98" rx="18"/><text class="label" x="1090" y="766">RelationStore Update</text><text class="small" x="1070" y="790">trust / stability / context_affinity</text><text class="small" x="1070" y="812">drift pattern / fragility</text>
    <path class="arrow" d="M885 729 C940 729 970 349 1030 349"/>
    <line class="arrow" x1="1205" y1="393" x2="1205" y2="440"/><line class="arrow" x1="1205" y1="528" x2="1205" y2="585"/><line class="arrow" x1="1205" y1="673" x2="1205" y2="730"/>
  </g>

  <path class="arrowBlue dash" d="M1030 779 C820 910 500 910 260 498"/>
  <path class="arrowBlue dash" d="M1030 779 C850 1040 260 1030 260 383"/>
  <path class="arrowRed dash" d="M1030 779 C905 930 770 930 725 643"/>
  <path class="arrowBlue dash" d="M1380 779 C1490 780 1490 240 410 229"/>
  <text class="small" x="620" y="950">Historical Feedback Loop: 過去のΔM・レビュー結果・ロールバック履歴が次回の契約生成、RDE判定、Policy判断へ戻る</text>

  <rect class="box" x="120" y="905" width="360" height="150" rx="18"/><text class="label" x="155" y="942">AuditLog</text><text class="small" x="155" y="970">不可逆的なイベント履歴</text><text class="small" x="155" y="996">TaskContract / Diff / RDE</text><text class="small" x="155" y="1022">Policy / Rollback / Human review</text>
  <rect class="box" x="1120" y="905" width="360" height="150" rx="18"/><text class="label" x="1155" y="942">RelationStore</text><text class="small" x="1155" y="970">履歴から抽出された関係状態</text><text class="small" x="1155" y="996">trust / stability / affinity</text><text class="small" x="1155" y="1022">generator reliability / document fragility</text>
  <path class="arrowBlue" d="M480 980 C650 1060 950 1060 1120 980"/>
</svg>
