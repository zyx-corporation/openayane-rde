[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openayane-rde"
version = "0.1.1"
description = "OpenAyane RDE: structural and semantic deviation evaluation for generative and agentic systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Tomoyuki Kano" }
]
keywords = [
  "rde",
  "openayane",
  "semantic-drift",
  "agent-safety",
  "structural-diff"
]
dependencies = [
  "pydantic>=2.0",
  "jsonschema>=4.0",
  "python-dateutil>=2.8"
]

[project.scripts]
openayane-rde = "openayane_rde.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-python-dateutil>=2.8",
  "starlette>=0.37",
  "httpx>=0.27"
]
markdown = [
  "markdown-it-py>=3.0"
]
python_ast = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Script adjusts sys.path before importing tests / package.
"benchmarks/evaluate.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src/openayane_rde", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
strict = true
show_error_codes = true
pretty = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
exclude = [
  "^build/",
  "^dist/",
  "^\\.venv/",
  "^\\.mypy_cache/",
  "^tests/golden/fixtures/"
]

[[tool.mypy.overrides]]
module = [
  "tests.*"
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
