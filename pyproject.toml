[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openayane-rde"
version = "0.1.0"
description = "OpenAyane RDE: structural and semantic deviation evaluation for generative and agentic systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Tomoyuki Kano" }
]
keywords = [
  "rde",
  "openayane",
  "semantic-drift",
  "agent-safety",
  "structural-diff"
]
dependencies = [
  "pydantic>=2.0",
  "jsonschema>=4.0",
  "python-dateutil>=2.8"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.8"
]
markdown = [
  "markdown-it-py>=3.0"
]
python_ast = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
